# ──────────────────────────────────────────────────────────────────────
# Automated Backtesting System — Configuration
# ──────────────────────────────────────────────────────────────────────

# Index to backtest against
index: "NIFTY"

# Timeframes to run in the main loop (each gets its own planner + exec node)
timeframes:
  - "5min"
  - "daily"
  - "weekly"

# ── Main loop ────────────────────────────────────────────────────────

# Number of strategies each planner generates per iteration
strategies_per_iteration: 1

# Stop when each timeframe reaches this many logged strategies
max_strategies_per_timeframe: 3

# ── Refinement loop ─────────────────────────────────────────────────

# Number of cross-timeframe strategies the refiner generates per batch
strategies_per_refinement: 1

# Seconds between DB polls when waiting for a threshold
refinement_poll_interval: 30

# Refinement kicks in every N main-loop strategies (cumulative across timeframes)
refinement_threshold_step: 3

# ── Winner criteria ──────────────────────────────────────────────────
#
# A strategy is a winner when it shows BOTH directional consistency and
# significant average movement:
#   long  → win_rate >= min_win_rate        AND mean >=  min_abs_mean
#   short → win_rate <= (100 - min_win_rate) AND mean <= -min_abs_mean
# Expectancy is still computed and stored, but no longer part of the filter.

# Minimum win_rate (%) for a long winner (and its mirror: max 100-x for short)
min_win_rate: 60

# Minimum |mean forward return| (%) to qualify as a winner
min_abs_mean: 0.30

# Minimum number of signals to qualify as a winner
min_signals: 30

# Max winners to fetch for refinement context
max_winners: 50

# ── Data paths ───────────────────────────────────────────────────────

data_dirs:
  5min: "data/5min"
  daily: "data/daily"
  weekly: "data/weekly"

db_path: "logs/autoresearch.db"

# ── Git / publish ────────────────────────────────────────────────────

# Master switch. When false, publish() is a no-op — nothing is committed or
# pushed anywhere. Local DB and strategies/*.py still update as usual.
publish_to_github: false

# Branch prefix — each timeframe pushes to <branch_prefix>/<timeframe>
branch_prefix: "experiments-1"

# ── LLM ──────────────────────────────────────────────────────────────
#
# api_key and (Azure) azure_endpoint are optional — if omitted, the
# provider SDK falls back to env vars: AZURE_OPENAI_API_KEY +
# AZURE_OPENAI_ENDPOINT, OPENAI_API_KEY, or ANTHROPIC_API_KEY.

llm:
  provider: "anthropic"       # azure_openai | openai | anthropic
  model: "claude-opus-4-7"               # model name (or Azure deployment name)
  temperature: 1
  api_key: "***"                  # optional; falls back to provider env var
  # api_version: "2024-12-01-preview"  # Azure-only
  # azure_endpoint: ""           # Azure-only; falls back to AZURE_OPENAI_ENDPOINT
